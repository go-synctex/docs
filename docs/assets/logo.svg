<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-synctex">
  <defs>
    <linearGradient id="synctex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#synctex)"/>
  <!-- SyncTeX: the .tex source (left) and the PDF page (right) kept in sync -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <rect x="32" y="60" width="60" height="136" rx="12"/>
    <rect x="164" y="60" width="60" height="136" rx="12"/>
    <!-- source lines (left) -->
    <line x1="46" y1="86" x2="78" y2="86"/>
    <line x1="46" y1="170" x2="78" y2="170"/>
    <!-- page lines (right) -->
    <line x1="178" y1="86" x2="210" y2="86"/>
    <line x1="178" y1="170" x2="210" y2="170"/>
    <!-- bidirectional sync arrows across the gap -->
    <path d="M100 106 H156"/>
    <path d="M156 106 L142 96"/>
    <path d="M156 106 L142 116"/>
    <path d="M156 150 H100"/>
    <path d="M100 150 L114 140"/>
    <path d="M100 150 L114 160"/>
  </g>
  <circle cx="62" cy="128" r="9" fill="#FFFFFF"/>
  <circle cx="194" cy="128" r="9" fill="#FFFFFF"/>
</svg>
